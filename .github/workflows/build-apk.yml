name: Build Check Calendar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CheckCalendar-Full.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q CheckCalendar-Full.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd extracted
          gradle assembleDebug

      - name: Find APK
        run: |
          find extracted -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CheckCalendar-APK
          path: extracted/**/build/outputs/apk/**/*.apk
